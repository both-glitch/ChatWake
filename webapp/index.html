<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatWake</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header-row">
    <h2>ChatWake <span class="accent">·</span> Group Activity</h2>
    <div style="display:flex; gap:8px;">
      <div class="theme-toggle" id="invite-toggle" onclick="toggleInvitePanel()" style="display:none;">+</div>
      <div class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</div>
    </div>
  </div>

  <div id="invitations-view"></div>
  <div id="groups-view"></div>
  <div id="members-view"></div>
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
